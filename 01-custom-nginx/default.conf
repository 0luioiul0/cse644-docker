server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Identify the container that served the response (used as proxy evidence later)
    add_header X-Served-By $hostname always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Plain-text endpoint that prints the container hostname
    location /whoami {
        default_type text/plain;
        return 200 "$hostname\n";
    }

    location /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
